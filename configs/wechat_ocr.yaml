  max_pages_per_source: 20
  max_depth: 2
  timeout_seconds: 15
  respect_robots_txt: true
  user_agent: "source-audit/0.1 (+public-source-risk-audit)"

wechat:
  follow_mp_links: true

image_ocr:
  enabled: true
  max_images_per_page: 5
  max_image_bytes: 4000000
  min_text_chars: 6
  mistral_api_key: ""
  mistral_model: "mistral-ocr-latest"

storage:
